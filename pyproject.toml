[project]
name = "deepeval-project"
version = "0.1.0"
description = "RAG evaluation system using DeepEval + Confident AI"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=0.21.0",
    "anthropic>=0.20.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
